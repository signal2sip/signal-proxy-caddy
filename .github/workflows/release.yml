# One static binary per {OS, CPU arch} pair, not per distro - Caddy +
# caddy-l4 build with CGO_ENABLED=0 (verified: neither has a cgo
# dependency), so the Go runtime makes syscalls directly instead of
# going through libc. The linux binaries run unmodified on glibc
# (Debian/Ubuntu) and musl (Alpine/Gentoo, both via openrc/signal-proxy)
# alike - only GOARCH varies there. FreeBSD needs its own GOOS=freebsd
# build (see freebsd/signal_proxy for its rc.d script) since it's a
# different kernel/syscall ABI, not just a different init system.
#
# Tag push (`v*`) builds + attaches binaries to a GitHub Release.
# workflow_dispatch builds the same matrix without releasing, for
# testing the build itself without committing to a version.
name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        goos: [linux, freebsd]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          out="signal-proxy-caddy_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}"
          "$(go env GOPATH)/bin/xcaddy" build --with github.com/mholt/caddy-l4 --output "$out"
          sha256sum "$out" > "$out.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: signal-proxy-caddy_${{ matrix.goos }}_${{ matrix.goarch }}
          path: signal-proxy-caddy_*_${{ matrix.goos }}_${{ matrix.goarch }}*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes needs a real git checkout to
      # diff against the previous tag - download-artifact alone doesn't
      # give it one.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
